<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel — Kingpin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script type="module">
import { requireAuth, api } from "./js/api.js";
import { renderShell, loadState } from "./js/nav.js";

requireAuth();
renderShell();

const CITIES = [
  { id: "redgate", name: "Redgate City", travelMinutes: 0, unlockLevel: 1 },
  { id: "millhaven", name: "Millhaven", travelMinutes: 3, unlockLevel: 3 },
  { id: "east-vance", name: "East Vance", travelMinutes: 6, unlockLevel: 7 },
  { id: "port-solano", name: "Port Solano", travelMinutes: 10, unlockLevel: 12 },
  { id: "old-quarter", name: "The Old Quarter", travelMinutes: 15, unlockLevel: 18 },
];

let currentUser = null;

function render() {
  const html = CITIES.map((c) => {
    const locked = currentUser.level < c.unlockLevel;
    const here = currentUser.city === c.name;
    return `
      <div class="card">
        <div class="card-row">
          <div>
            <h3>${c.name} ${here ? '<span class="tag">You are here</span>' : ""}</h3>
            <p class="meta">${c.travelMinutes === 0 ? "Home base" : `${c.travelMinutes} min travel`} ${locked ? `· Requires level ${c.unlockLevel}` : ""}</p>
          </div>
          <button data-id="${c.id}" class="travel-btn" ${locked || here ? "disabled" : ""}>Travel</button>
        </div>
      </div>
    `;
  }).join("");

  document.getElementById("page-content").innerHTML = `<h2>Travel</h2><div id="result"></div>${html}`;
  document.querySelectorAll(".travel-btn").forEach((btn) => btn.addEventListener("click", () => go(btn.dataset.id)));
}

async function go(cityId) {
  const resultEl = document.getElementById("result");
  try {
    const data = await api("travel", { method: "POST", body: JSON.stringify({ cityId }) });
    currentUser = data.user;
    resultEl.innerHTML = `<div class="success-msg">On your way.</div>`;
    render();
    document.getElementById("result").innerHTML = `<div class="success-msg">On your way.</div>`;
    await loadState();
  } catch (err) {
    resultEl.innerHTML = `<div class="error-msg">${err.message}</div>`;
  }
}

async function init() {
  const { user } = await loadState();
  currentUser = user;
  render();
}

init();
</script>
</body>
</html>
