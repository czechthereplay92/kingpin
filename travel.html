<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel — Kingpin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script type="module">
import { requireAuth, api } from "./js/api.js";
import { renderShell, loadState } from "./js/nav.js";
import { citySkylineSvg } from "./js/skylines.js";

requireAuth();
renderShell();

const CITIES = [
  { id: "new-york", name: "New York City", travelMinutes: 0, unlockLevel: 1, blurb: "Home turf. Five families, endless opportunity." },
  { id: "chicago", name: "Chicago", travelMinutes: 4, unlockLevel: 4, blurb: "The Outfit's town. Windy streets, wet business." },
  { id: "philadelphia", name: "Philadelphia", travelMinutes: 6, unlockLevel: 7, blurb: "Row houses and old grudges that never die." },
  { id: "atlantic-city", name: "Atlantic City", travelMinutes: 8, unlockLevel: 10, blurb: "Boardwalk empire — casinos built on favors owed." },
  { id: "las-vegas", name: "Las Vegas", travelMinutes: 14, unlockLevel: 15, blurb: "Neon and skim money as far as the eye can see." },
  { id: "miami", name: "Miami", travelMinutes: 18, unlockLevel: 20, blurb: "Sun, speedboats, and Lansky's old shadow." },
];

let currentUser = null;

function render() {
  const html = CITIES.map((c) => {
    const locked = currentUser.level < c.unlockLevel;
    const here = currentUser.city === c.name;
    return `
      <div class="city-card">
        ${citySkylineSvg(c.id, { height: 100 })}
        <div class="city-body">
          <div>
            <h3>${c.name} ${here ? '<span class="tag">You are here</span>' : ""}</h3>
            <p class="meta">${c.blurb}</p>
            <p class="meta">${c.travelMinutes === 0 ? "Home base" : `${c.travelMinutes} min travel`} ${locked ? `· Requires level ${c.unlockLevel}` : ""}</p>
          </div>
          <button data-id="${c.id}" class="travel-btn" ${locked || here ? "disabled" : ""}>Travel</button>
        </div>
      </div>
    `;
  }).join("");

  document.getElementById("page-content").innerHTML = `<h2>Travel</h2><div id="result"></div>${html}`;
  document.querySelectorAll(".travel-btn").forEach((btn) => btn.addEventListener("click", () => go(btn.dataset.id)));
}

async function go(cityId) {
  const resultEl = document.getElementById("result");
  try {
    const data = await api("travel", { method: "POST", body: JSON.stringify({ cityId }) });
    currentUser = data.user;
    render();
    document.getElementById("result").innerHTML = `<div class="success-msg">On your way.</div>`;
    await loadState();
  } catch (err) {
    resultEl.innerHTML = `<div class="error-msg">${err.message}</div>`;
  }
}

async function init() {
  const { user } = await loadState();
  currentUser = user;
  render();
}

init();
</script>
</body>
</html>
