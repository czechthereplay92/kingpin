<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Kingpin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script type="module">
import { requireAuth, api } from "./js/api.js";
import { renderShell, loadState } from "./js/nav.js";

requireAuth();
renderShell();

const EDIT_FIELDS = [
  ["money", "Cash"], ["bank", "Bank"], ["level", "Level"], ["exp", "Exp"],
  ["health", "Health"], ["maxHealth", "Max HP"],
  ["energy", "Energy"], ["maxEnergy", "Max Energy"],
  ["brave", "Brave"], ["maxBrave", "Max Brave"],
  ["will", "Will"], ["maxWill", "Max Will"],
  ["strength", "Strength"], ["defense", "Defense"], ["speed", "Speed"],
  ["kills", "Kills"], ["losses", "Losses"],
];

let editingUsername = null;
let searchQuery = "";

function statusTags(u) {
  const tags = [];
  if (u.isAdmin) tags.push(`<span class="tag ledger">Admin</span>`);
  if (u.banned) tags.push(`<span class="tag blood">Banned</span>`);
  if (u.jailUntil && u.jailUntil > Date.now()) tags.push(`<span class="tag">Jailed</span>`);
  if (u.hospitalUntil && u.hospitalUntil > Date.now()) tags.push(`<span class="tag">Hospital</span>`);
  return tags.join(" ");
}

function editFormHtml(u) {
  const inputs = EDIT_FIELDS.map(([key, label]) => `
    <div>
      <label>${label}</label>
      <input type="number" data-field="${key}" value="${Math.floor(u[key] ?? 0)}">
    </div>
  `).join("");

  return `
    <tr>
      <td colspan="6">
        <div class="card" style="margin:0;">
          <h3>Editing ${u.username}</h3>
          <div class="edit-grid">${inputs}
            <div><label>City</label><input type="text" data-field="city" value="${u.city}"></div>
          </div>
          <p class="ip-list">Last IP: ${u.lastIp || "unknown"} · History: ${(u.ipHistory || []).join(", ") || "none"}</p>
          <div class="btn-row">
            <button class="save-edit-btn" data-username="${u.username}">Save changes</button>
            <button class="cancel-edit-btn">Cancel</button>
            ${u.jailUntil ? `<button class="clear-jail-btn" data-username="${u.username}">Release from jail</button>` : ""}
            ${u.hospitalUntil ? `<button class="clear-hospital-btn" data-username="${u.username}">Discharge from hospital</button>` : ""}
          </div>
        </div>
      </td>
    </tr>
  `;
}

function userRowHtml(u) {
  if (u.username === editingUsername) return editFormHtml(u);
  return `
    <tr>
      <td>${u.username} ${statusTags(u)}</td>
      <td>${u.level}</td>
      <td>$${Math.floor(u.money + u.bank).toLocaleString()}</td>
      <td>${u.lastIp || "unknown"}</td>
      <td class="btn-row">
        <button class="edit-btn" data-username="${u.username}">Edit</button>
        ${u.banned
          ? `<button class="unban-btn" data-username="${u.username}">Unban</button>`
          : `<button class="ban-btn danger" data-username="${u.username}">Ban</button>`}
        <button class="revoke-btn" data-username="${u.username}">Revoke sessions</button>
        ${u.isAdmin
          ? `<button class="demote-btn" data-username="${u.username}">Demote</button>`
          : `<button class="promote-btn" data-username="${u.username}">Promote</button>`}
      </td>
    </tr>
  `;
}

async function render() {
  const params = new URLSearchParams(searchQuery ? { q: searchQuery } : {});
  const { users, bannedIps } = await api(`admin?${params}`);

  const rows = users.map(userRowHtml).join("");
  const ipRows = bannedIps.map((b) => `
    <tr>
      <td>${b.ip}</td>
      <td>${b.reason}</td>
      <td>${b.bannedBy || "-"}</td>
      <td><button class="unban-ip-btn" data-ip="${b.ip}">Unban</button></td>
    </tr>
  `).join("");

  document.getElementById("page-content").innerHTML = `
    <h2>Admin</h2>
    <div id="result"></div>

    <div class="card">
      <input type="text" id="search-input" class="admin-search" placeholder="Search username..." value="${searchQuery}">
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Player</th><th>Lvl</th><th>Net worth</th><th>Last IP</th><th>Actions</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="5">No players found.</td></tr>`}</tbody>
      </table>
    </div>

    <h3>Banned IPs</h3>
    <div class="card">
      <div class="field"><input type="text" id="new-ban-ip" placeholder="IP address"></div>
      <div class="field"><input type="text" id="new-ban-ip-reason" placeholder="Reason"></div>
      <button id="ban-ip-btn">Ban IP</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>IP</th><th>Reason</th><th>Banned by</th><th></th></tr></thead>
        <tbody>${ipRows || `<tr><td colspan="4">No banned IPs.</td></tr>`}</tbody>
      </table>
    </div>
  `;

  attachHandlers();
}

function attachHandlers() {
  document.getElementById("search-input").addEventListener("input", (e) => {
    searchQuery = e.target.value;
    render();
  });

  document.getElementById("ban-ip-btn").addEventListener("click", async () => {
    const ip = document.getElementById("new-ban-ip").value.trim();
    const reason = document.getElementById("new-ban-ip-reason").value.trim();
    if (!ip) return;
    await act({ action: "ban-ip", ip, reason });
  });

  document.querySelectorAll(".unban-ip-btn").forEach((btn) =>
    btn.addEventListener("click", () => act({ action: "unban-ip", ip: btn.dataset.ip }))
  );

  document.querySelectorAll(".edit-btn").forEach((btn) =>
    btn.addEventListener("click", () => { editingUsername = btn.dataset.username; render(); })
  );

  document.querySelectorAll(".cancel-edit-btn").forEach((btn) =>
    btn.addEventListener("click", () => { editingUsername = null; render(); })
  );

  document.querySelectorAll(".save-edit-btn").forEach((btn) =>
    btn.addEventListener("click", () => {
      const row = btn.closest("tr");
      const fields = {};
      row.querySelectorAll("[data-field]").forEach((input) => {
        fields[input.dataset.field] = input.value;
      });
      editingUsername = null;
      act({ action: "edit", username: btn.dataset.username, fields });
    })
  );

  document.querySelectorAll(".clear-jail-btn").forEach((btn) =>
    btn.addEventListener("click", () => act({ action: "clear-jail", username: btn.dataset.username }))
  );

  document.querySelectorAll(".clear-hospital-btn").forEach((btn) =>
    btn.addEventListener("click", () => act({ action: "clear-hospital", username: btn.dataset.username }))
  );

  document.querySelectorAll(".ban-btn").forEach((btn) =>
    btn.addEventListener("click", () => {
      const reason = window.prompt(`Reason for banning ${btn.dataset.username}?`, "");
      if (reason === null) return;
      act({ action: "ban-user", username: btn.dataset.username, reason });
    })
  );

  document.querySelectorAll(".unban-btn").forEach((btn) =>
    btn.addEventListener("click", () => act({ action: "unban-user", username: btn.dataset.username }))
  );

  document.querySelectorAll(".revoke-btn").forEach((btn) =>
    btn.addEventListener("click", () => act({ action: "revoke-sessions", username: btn.dataset.username }))
  );

  document.querySelectorAll(".promote-btn").forEach((btn) =>
    btn.addEventListener("click", () => act({ action: "promote", username: btn.dataset.username }))
  );

  document.querySelectorAll(".demote-btn").forEach((btn) =>
    btn.addEventListener("click", () => act({ action: "demote", username: btn.dataset.username }))
  );
}

async function act(body) {
  const resultEl = document.getElementById("result");
  try {
    await api("admin", { method: "POST", body: JSON.stringify(body) });
    resultEl.innerHTML = "";
    await render();
  } catch (err) {
    resultEl.innerHTML = `<div class="error-msg">${err.message}</div>`;
  }
}

async function init() {
  const { user } = await loadState();
  if (!user.isAdmin) {
    document.getElementById("page-content").innerHTML = `<div class="error-msg">You don't have access to this page.</div>`;
    return;
  }
  await render();
}

init();
</script>
</body>
</html>
