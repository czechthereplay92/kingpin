<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — Kingpin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script type="module">
import { requireAuth, api } from "./js/api.js";
import { renderShell, loadState } from "./js/nav.js";

requireAuth();
renderShell();

async function render() {
  const { leaderboard } = await api("leaderboard");
  const rows = leaderboard.map((r, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${r.username}</td>
      <td>${r.level}</td>
      <td>$${r.netWorth.toLocaleString()}</td>
      <td>${r.kills}-${r.losses}</td>
    </tr>
  `).join("");

  document.getElementById("page-content").innerHTML = `
    <h2>Leaderboard</h2>
    <div class="card">
      <table>
        <thead><tr><th>#</th><th>Player</th><th>Level</th><th>Net worth</th><th>Record</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

async function init() {
  await loadState();
  await render();
}

init();
</script>
</body>
</html>
