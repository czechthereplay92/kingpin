<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobs — Kingpin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script type="module">
import { requireAuth, api } from "./js/api.js";
import { renderShell, loadState } from "./js/nav.js";

requireAuth();
renderShell();

const JOBS = [
  { id: "dishwasher", name: "Dishwasher", unlockLevel: 1, energyCost: 10, pay: 30 },
  { id: "driver", name: "Getaway Driver", unlockLevel: 4, energyCost: 15, pay: 90 },
  { id: "bookkeeper", name: "Bookkeeper", unlockLevel: 8, energyCost: 20, pay: 200 },
  { id: "fixer", name: "Fixer", unlockLevel: 14, energyCost: 25, pay: 450 },
  { id: "consigliere", name: "Consigliere", unlockLevel: 20, energyCost: 30, pay: 900 },
];

let currentUser = null;

function render() {
  const currentJob = JOBS.find((j) => j.id === currentUser.jobId);

  const currentHtml = currentJob
    ? `<div class="card">
        <div class="card-row">
          <div><h3>Current job: ${currentJob.name}</h3><p class="meta">Shifts worked: ${currentUser.jobShiftsWorked}</p></div>
          <div class="card-row">
            <button id="work-btn" ${currentUser.energy < currentJob.energyCost ? "disabled" : ""}>Work a shift ($${currentJob.pay})</button>
            <button id="quit-btn" class="danger">Quit</button>
          </div>
        </div>
      </div>`
    : `<div class="card"><p class="meta">You're unemployed. Apply for a job below.</p></div>`;

  const listHtml = JOBS.map((j) => {
    const locked = currentUser.level < j.unlockLevel;
    const isCurrent = j.id === currentUser.jobId;
    return `
      <div class="card">
        <div class="card-row">
          <div>
            <h3>${j.name}</h3>
            <p class="meta">Pays $${j.pay}/shift · Costs ${j.energyCost} energy ${locked ? `· Requires level ${j.unlockLevel}` : ""}</p>
          </div>
          <button data-id="${j.id}" class="apply-btn" ${locked || isCurrent ? "disabled" : ""}>${isCurrent ? "Current job" : "Apply"}</button>
        </div>
      </div>
    `;
  }).join("");

  document.getElementById("page-content").innerHTML = `<h2>Jobs</h2><div id="result"></div>${currentHtml}${listHtml}`;

  document.getElementById("work-btn")?.addEventListener("click", () => act({ action: "work" }));
  document.getElementById("quit-btn")?.addEventListener("click", () => act({ action: "quit" }));
  document.querySelectorAll(".apply-btn").forEach((btn) =>
    btn.addEventListener("click", () => act({ action: "apply", jobId: btn.dataset.id }))
  );
}

async function act(body) {
  const resultEl = document.getElementById("result");
  try {
    const data = await api("job", { method: "POST", body: JSON.stringify(body) });
    currentUser = data.user;
    const msg = data.pay ? `Worked a shift. Made $${data.pay}${data.leveledUp ? " and leveled up!" : ""}.` : "Done.";
    render();
    document.getElementById("result").innerHTML = `<div class="success-msg">${msg}</div>`;
    await loadState();
  } catch (err) {
    resultEl.innerHTML = `<div class="error-msg">${err.message}</div>`;
  }
}

async function init() {
  const { user } = await loadState();
  currentUser = user;
  render();
}

init();
</script>
</body>
</html>
