<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym — Kingpin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script type="module">
import { requireAuth, api } from "./js/api.js";
import { renderShell, loadState } from "./js/nav.js";

requireAuth();
renderShell();

const STATS = [
  { id: "strength", label: "Strength", desc: "Raw power in a fight." },
  { id: "defense", label: "Defense", desc: "How much damage you shrug off." },
  { id: "speed", label: "Speed", desc: "First strike and escape odds." },
];

let currentUser = null;

function renderList() {
  const html = STATS.map((s) => `
    <div class="card">
      <div class="card-row">
        <div>
          <h3>${s.label} — ${Math.floor(currentUser[s.id])}</h3>
          <p class="meta">${s.desc} · Costs 5 energy per session</p>
        </div>
        <button data-id="${s.id}" class="train-btn" ${currentUser.energy < 5 ? "disabled" : ""}>Train</button>
      </div>
    </div>
  `).join("");

  document.getElementById("page-content").innerHTML = `<h2>Gym</h2><div id="result"></div>${html}`;
  document.querySelectorAll(".train-btn").forEach((btn) => btn.addEventListener("click", () => train(btn.dataset.id)));
}

async function train(stat) {
  const resultEl = document.getElementById("result");
  resultEl.innerHTML = "";
  try {
    const data = await api("train", { method: "POST", body: JSON.stringify({ stat }) });
    currentUser = data.user;
    resultEl.innerHTML = `<div class="success-msg">+${data.gained} ${stat}.</div>`;
    renderList();
    document.getElementById("result").innerHTML = `<div class="success-msg">+${data.gained} ${stat}.</div>`;
    const { maxes } = await loadState();
  } catch (err) {
    resultEl.innerHTML = `<div class="error-msg">${err.message}</div>`;
  }
}

async function init() {
  const { user } = await loadState();
  currentUser = user;
  renderList();
}

init();
</script>
</body>
</html>
