<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingpin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>KINGPIN</h1>
    <div class="auth-sub">Build your empire. Watch your back.</div>
    <div id="msg"></div>

    <form id="auth-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="primary" id="submit-btn">Log In</button>
    </form>

    <div class="switch-link">
      <span id="switch-text">New to the city?</span>
      <a href="#" id="switch-link">Create an account</a>
    </div>
  </div>
</div>

<script type="module">
import { api, setToken, getToken } from "./js/api.js";

if (getToken()) window.location.href = "dashboard.html";

let mode = "login";
const form = document.getElementById("auth-form");
const submitBtn = document.getElementById("submit-btn");
const switchLink = document.getElementById("switch-link");
const switchText = document.getElementById("switch-text");
const msg = document.getElementById("msg");

switchLink.addEventListener("click", (e) => {
  e.preventDefault();
  mode = mode === "login" ? "register" : "login";
  submitBtn.textContent = mode === "login" ? "Log In" : "Create Account";
  switchText.textContent = mode === "login" ? "New to the city?" : "Already have an account?";
  switchLink.textContent = mode === "login" ? "Create an account" : "Log in";
  msg.innerHTML = "";
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.innerHTML = "";
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  submitBtn.disabled = true;
  try {
    const data = await api(mode, { method: "POST", body: JSON.stringify({ username, password }) });
    setToken(data.token);
    window.location.href = "dashboard.html";
  } catch (err) {
    msg.innerHTML = `<div class="error-msg">${err.message}</div>`;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
