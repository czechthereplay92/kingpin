<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank — Kingpin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script type="module">
import { requireAuth, api } from "./js/api.js";
import { renderShell, loadState } from "./js/nav.js";

requireAuth();
renderShell();

function render(user) {
  document.getElementById("page-content").innerHTML = `
    <h2>Bank</h2>
    <div id="result"></div>
    <div class="card">
      <p class="meta">Cash on hand: <strong>$${Math.floor(user.money).toLocaleString()}</strong> — money attackers can steal.</p>
      <p class="meta">In the bank: <strong>$${Math.floor(user.bank).toLocaleString()}</strong> — safe from attacks.</p>
    </div>
    <div class="card">
      <h3>Deposit</h3>
      <div class="field"><input type="number" id="deposit-amount" placeholder="Amount" min="1"></div>
      <button id="deposit-btn">Deposit</button>
    </div>
    <div class="card">
      <h3>Withdraw</h3>
      <div class="field"><input type="number" id="withdraw-amount" placeholder="Amount" min="1"></div>
      <button id="withdraw-btn">Withdraw</button>
    </div>
  `;

  document.getElementById("deposit-btn").addEventListener("click", () => doAction("deposit", "deposit-amount"));
  document.getElementById("withdraw-btn").addEventListener("click", () => doAction("withdraw", "withdraw-amount"));
}

async function doAction(action, inputId) {
  const amount = Number(document.getElementById(inputId).value);
  const resultEl = document.getElementById("result");
  try {
    const data = await api("bank", { method: "POST", body: JSON.stringify({ action, amount }) });
    resultEl.innerHTML = `<div class="success-msg">Done.</div>`;
    render(data.user);
    document.getElementById("result").innerHTML = `<div class="success-msg">Done.</div>`;
    await loadState();
  } catch (err) {
    resultEl.innerHTML = `<div class="error-msg">${err.message}</div>`;
  }
}

async function init() {
  const { user } = await loadState();
  render(user);
}

init();
</script>
</body>
</html>
