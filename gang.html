<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gang — Kingpin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script type="module">
import { requireAuth, api } from "./js/api.js";
import { renderShell, loadState } from "./js/nav.js";

requireAuth();
renderShell();

async function render() {
  const { gangs, mine } = await api("gang");

  if (mine) {
    document.getElementById("page-content").innerHTML = `
      <h2>Gang</h2>
      <div id="result"></div>
      <div class="card">
        <h3>${mine.name}</h3>
        <p class="meta">Leader: ${mine.leader} · ${mine.members.length} member(s)</p>
        <table>
          <thead><tr><th>Member</th></tr></thead>
          <tbody>${mine.members.map((m) => `<tr><td>${m}</td></tr>`).join("")}</tbody>
        </table>
        <button id="leave-btn" class="danger" style="margin-top:12px;">Leave gang</button>
      </div>
    `;
    document.getElementById("leave-btn").addEventListener("click", () => act({ action: "leave" }));
    return;
  }

  const listHtml = gangs.length
    ? gangs.map((g) => `
        <div class="card">
          <div class="card-row">
            <div><h3>${g.name}</h3><p class="meta">Led by ${g.leader} · ${g.members} member(s)</p></div>
            <button data-id="${g.id}" class="join-btn">Join</button>
          </div>
        </div>
      `).join("")
    : `<div class="card"><p class="meta">No gangs yet. Found the first one.</p></div>`;

  document.getElementById("page-content").innerHTML = `
    <h2>Gang</h2>
    <div id="result"></div>
    <div class="card">
      <h3>Found a gang</h3>
      <p class="meta">Costs $5,000</p>
      <div class="field"><input type="text" id="gang-name" placeholder="Gang name" maxlength="30"></div>
      <button id="create-btn">Found gang</button>
    </div>
    <h3>Join an existing gang</h3>
    ${listHtml}
  `;

  document.getElementById("create-btn").addEventListener("click", () => {
    const name = document.getElementById("gang-name").value.trim();
    act({ action: "create", name });
  });
  document.querySelectorAll(".join-btn").forEach((btn) =>
    btn.addEventListener("click", () => act({ action: "join", gangId: btn.dataset.id }))
  );
}

async function act(body) {
  const resultEl = document.getElementById("result") || document.createElement("div");
  try {
    await api("gang", { method: "POST", body: JSON.stringify(body) });
    await render();
    await loadState();
  } catch (err) {
    const target = document.getElementById("result");
    if (target) target.innerHTML = `<div class="error-msg">${err.message}</div>`;
  }
}

async function init() {
  await loadState();
  await render();
}

init();
</script>
</body>
</html>
